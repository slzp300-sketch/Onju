<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>온주 손그림 UI/UX 디자인 보드</title>
  <style>
    :root{color-scheme:light;--paper:#f8f4e9;--ink:#213c2c;--line:#ded4bf;--card:#fffdf7}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:#34312b;font-family:system-ui,-apple-system,sans-serif}
    header{position:sticky;top:0;z-index:2;padding:22px 28px;background:#f8f4e9ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    h1{margin:0;color:var(--ink);font-size:24px}p{margin:6px 0 0;color:#746d61}
    main{max-width:1500px;margin:auto;padding:24px;display:grid;gap:28px}
    article{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px #4b402b10}
    h2{margin:0;padding:16px 20px;color:var(--ink);font-size:18px;border-bottom:1px solid var(--line)}
    img{display:block;width:100%;height:auto}
  </style>
</head>
<body>
  <header><h1>온주 손그림 UI/UX 디자인 보드</h1><p>공통 요소부터 화면군까지 6개 시안</p></header>
  <main>
    <article><h2>01 · 공통 컨트롤</h2><img src="../../assets/onju-ui-design/boards/01-common-controls.png" alt="공통 컨트롤 디자인 보드"></article>
    <article><h2>02 · 카드·내비게이션·데이터</h2><img src="../../assets/onju-ui-design/boards/02-cards-navigation-data.png" alt="카드와 데이터 디자인 보드"></article>
    <article><h2>03 · 오버레이·피드백</h2><img src="../../assets/onju-ui-design/boards/03-overlays-feedback.png" alt="오버레이와 피드백 디자인 보드"></article>
    <article><h2>04 · 홈·루틴 화면군</h2><img src="../../assets/onju-ui-design/boards/04-home-routines.png" alt="홈과 루틴 화면 디자인 보드"></article>
    <article><h2>05 · 목표·통계·회고 화면군</h2><img src="../../assets/onju-ui-design/boards/05-goals-stats-review.png" alt="목표 통계 회고 디자인 보드"></article>
    <article><h2>06 · 소모임·프로필·인증 화면군</h2><img src="../../assets/onju-ui-design/boards/06-groups-profile-auth.png" alt="소모임 프로필 인증 디자인 보드"></article>
  </main>
</body>
</html>
