name: ci

# PR과 main push마다 린트·죽은 코드 검사·테스트·빌드를 돌린다.
# 클라우드에서 일하는 Claude 스레드는 이 PC의 훅·검수를 쓰지 못하므로, 이 검사가 독립적인 확인 역할을 한다.
# main push는 곧 Vercel 운영 배포이므로, 실패하면 GitHub이 메일을 보낸다.
# Supabase 마이그레이션 적용과 에지 함수 배포는 여기서 하지 않는다(사람이 한다).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 테스트가 Supabase 클라이언트를 만들 때 주소가 있어야 한다. 실제 서버에는 연결하지 않는 가짜 로컬 값.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and dead-code check (eslint + knip)
        run: npm run gc
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
